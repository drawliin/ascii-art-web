<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascii-art-web</title>
    <link rel="stylesheet" href="/static/index.css">
</head>

<body>

    <h1>- Ascii-art Web -</h1>

    <form action="http://localhost:8080/ascii-art" method="POST">
        <textarea name="input" placeholder="ex: Hello" maxlength="2000" required>{{.UserInput}}</textarea>
        <div>
            <label>
                <input type="radio" name="banner" value="standard" required {{if eq .Font "standard" }}checked{{end}}>
                Standard
            </label>

            <label>
                <input type="radio" name="banner" value="shadow" {{if eq .Font "shadow" }}checked{{end}}>
                Shadow
            </label>

            <label>
                <input type="radio" name="banner" value="thinkertoy" {{if eq .Font "thinkertoy" }}checked{{end}}>
                Thinkertoy
            </label>
        </div>

        <button type="submit">Submit</button>
    </form>

    {{if .Art}}
    <pre class="output">{{.Art}}</pre>
    <form action="/download" method="POST">
        <textarea name="input" maxlength="2000" hidden>{{.UserInput}}</textarea>
        <input type="hidden" name="banner" value="{{.Font}}">
        <button type="submit">Download</button>
    </form>
    {{else}}
    {{if .ErrorMsg}}
    <p class="error">{{.ErrorMsg}}</p>
    {{end}}
    {{end}}

</body>

</html>
