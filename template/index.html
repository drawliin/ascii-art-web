<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascii-art-web</title>
    <link rel="stylesheet" href="/static/ascii-art-web.css">
</head>

<body>

    <h1>- Ascii-art Web -</h1>

    <form action="http://localhost:8080/ascii" method="POST">
        <textarea name="input" placeholder="ex: Hello" required>{{.PrevInput}}</textarea>
        <div>
            <label>
                <input type="radio" name="banner" value="standard" required checked>
                Standard
            </label>
    
            <label>
                <input type="radio" name="banner" value="shadow">
                Shadow
            </label>
    
            <label>
                <input type="radio" name="banner" value="thinkertoy">
                Thinkertoy
            </label>
        </div>

        <button type="submit">Submit</button>
    </form>

    {{if .Art}}
    <pre class="output">{{.Art}}</pre>
    {{end}}

</body>
</html>
